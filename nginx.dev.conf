resolver 127.0.0.11 valid=30s;

server {
    listen 80;
    client_max_body_size 20M;

    location /static-backend/ {
        alias /app/staticfiles/;
        try_files $uri $uri/ @proxy_backend;
    }

    location /static/ {
        alias /app/staticfiles/;
    }

    location @proxy_backend {
        set $backend backend:8000;
        proxy_pass http://$backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Callback interno de n8n — forzar X-Forwarded-Proto: https para evitar redirect
    location /api/v1/agent/n8n/callback/ {
        set $backend backend:8000;
        proxy_pass http://$backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        set $backend backend:8000;
        proxy_pass http://$backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
