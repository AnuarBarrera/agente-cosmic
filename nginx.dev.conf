resolver 127.0.0.11 valid=30s;

# www y el dominio viejo redirigen al dominio principal (301, preserva la ruta)
server {
    listen 80;
    server_name www.agentecosmic.com cosmic.anuarbarrera.dev;
    return 301 https://agentecosmic.com$request_uri;
}

server {
    listen 80;
    server_name app.agentecosmic.com;
    client_max_body_size 20M;

    location /static-backend/ {
        alias /app/staticfiles/;
        try_files $uri $uri/ @proxy_backend;
    }

    location /static/ {
        alias /app/staticfiles/;
    }

    location @proxy_backend {
        set $backend backend:8000;
        proxy_pass http://$backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

location /media/ {
        alias /app/media/;
    }

    location /metrics {
        return 404;
    }

    location / {
        set $backend backend:8000;
        proxy_pass http://$backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
