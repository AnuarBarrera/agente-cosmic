services:
  db:
    image: pgvector/pgvector:pg16
    volumes:
      - cosmic_postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    ports:
      - "127.0.0.1:5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cosmic-net

  redis:
    image: "redis:alpine"
    command: redis-server --appendonly yes
    volumes:
      - cosmic_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "127.0.0.1:6380:6379"
    networks:
      - cosmic-net

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/app
    environment:
      - PROMETHEUS_MULTIPROC_DIR=/tmp/prometheus-multiproc
    env_file:
      - ./.env
    dns:
      - 8.8.8.8
      - 1.1.1.1
    extra_hosts:
      - "metadata.google.internal:169.254.169.254"
    ports:
      - "0.0.0.0:9091:8000"
    depends_on:
      - db
      - redis
    networks:
      - cosmic-net

  rqworker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    init: true
    entrypoint: ""
    command: python manage.py rqworker default --worker-ttl 1800 --with-scheduler
    deploy:
      replicas: 3
    volumes:
      - .:/app
    env_file:
      - ./.env
    dns:
      - 8.8.8.8
      - 1.1.1.1
    extra_hosts:
      - "metadata.google.internal:169.254.169.254"
    depends_on:
      - backend
      - redis
    networks:
      - cosmic-net

  nginx:
    image: nginx:alpine
    ports:
      - "0.0.0.0:${NGINX_PORT:-80}:80"
    volumes:
      - ./nginx.dev.conf:/etc/nginx/conf.d/default.conf
      - ./staticfiles:/app/staticfiles
      - ./media:/app/media
    depends_on:
      - backend
    networks:
      - cosmic-net

volumes:
  cosmic_postgres_data:
  cosmic_redis_data:

networks:
  cosmic-net:
    driver: bridge
