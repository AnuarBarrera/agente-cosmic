<!doctype html>
<html lang="es" data-composition-variables='[
  {"id":"photo_src","type":"string","label":"Foto del producto","default":"assets/tmp/placeholder.png"},
  {"id":"photo_aspect","type":"number","label":"Aspect ratio de la foto (ancho/alto)","default":1},
  {"id":"primary_color","type":"color","label":"Color primario","default":"#e94560"},
  {"id":"secondary_color","type":"color","label":"Color secundario","default":"#3ED694"},
  {"id":"camera_motion","type":"string","label":"Movimiento de camara","default":"sway_dolly"}
]'>
<head>
  <meta charset="UTF-8" />
  <title>Character Walk Reveal</title>
  <script type="importmap">
    {
      "imports": {
        "three": "./node_modules/three/build/three.module.js",
        "three/addons/": "./node_modules/three/examples/jsm/"
      }
    }
  </script>
  <style>
    body { margin: 0; background: #0b0f14; overflow: hidden; }
    #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
    .clip { position: absolute; inset: 0; }
    #three-canvas { width: 100%; height: 100%; display: block; }
    #product-photo { position: absolute; width: 1px; height: 1px; left: -9999px; top: -9999px; }
  </style>
</head>
<body>
  <div id="root" data-composition-id="character-walk-reveal" data-no-timeline data-start="0" data-width="1080" data-height="1920" data-duration="8">
    <section id="scene" class="clip" data-start="0" data-duration="8" data-track-index="0">
      <img id="product-photo" data-var-src="photo_src" src="assets/tmp/placeholder.png" crossorigin="anonymous" />
      <canvas id="three-canvas"></canvas>
    </section>
  </div>
  <script type="module">
    import * as THREE from "three";
    import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

    const DURATION = 8;
    const CHARACTER_GLB_URL = "assets/characters/mascot.glb";
    const WALK_CLIP_NAME = "walk";
    // 1.1 (mas grande que character-wave-hello's 0.9, ya que aqui el
    // personaje comparte pantalla con la foto solo en el tramo final, no
    // todo el video) -- probado empiricamente con renders reales: con 1.6
    // la pose de "walk" congelada (piernas/brazos en zancada, no una pose
    // parada neutral) mide ~1.6 unidades de ancho, tan ancha como alta, y
    // no cabe junto al marco sin recortarse contra el frustum en el tramo
    // final (sway_dolly mas cerrado). Ver reporte de Tarea 5 para la
    // medicion exacta y los renders de verificacion.
    const CHARACTER_TARGET_HEIGHT = 1.1;

    const { primary_color, secondary_color, photo_aspect, camera_motion } = window.__hyperframes.getVariables();

    const canvas = document.getElementById("three-canvas");
    const renderer = new THREE.WebGLRenderer({ canvas, alpha: false, antialias: true });
    renderer.setSize(1080, 1920, false);
    renderer.setPixelRatio(1);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0b0f14);
    const camera = new THREE.PerspectiveCamera(35, 1080 / 1920, 0.1, 100);
    camera.position.set(0, 0, 7);

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
    scene.add(ambientLight);
    const keyLight = new THREE.DirectionalLight(0xffffff, 2.0);
    keyLight.position.set(2, 3, 4);
    scene.add(keyLight);
    const fillLight = new THREE.DirectionalLight(0xaad4ff, 0.6);
    fillLight.position.set(-3, 1, 2);
    scene.add(fillLight);
    const rimLight = new THREE.DirectionalLight(new THREE.Color(secondary_color), 1.5);
    rimLight.position.set(-1, 2, -3);
    scene.add(rimLight);

    const cardGroup = new THREE.Group();
    scene.add(cardGroup);

    // El pipeline de render de HyperFrames arranca varios workers en
    // paralelo y cada uno puede pedir su primer frame antes de que este
    // modulo termine de resolver sus await (fetch+parse de mascot.glb,
    // ~cientos de ms) -- window.__hf ya reporta "listo" en cuanto el
    // adapter "three" detecta data-duration, independientemente de si nuestro
    // propio setup asincrono ya corrio. Verificado en render real en la
    // Tarea 4 (character-wave-hello): sin este guard, el frame exactamente
    // en el limite entre 2 workers salia casi negro (canvas nunca pintado).
    // Por eso el listener + un primer render "seguro" se registran ANTES de
    // cualquier await, y renderAt() tolera que mixer/character/photo
    // todavia no existan.
    let mixer = null;
    let lastRequestedTime = window.__hfThreeTime || 0;

    // Presupuesto de frustum propio de esta coreografia: el personaje
    // EMPIEZA fuera de camara y solo comparte espacio con la foto al llegar
    // a WALK_END_X, a diferencia de character-wave-hello (que lo comparte
    // todo el tiempo). Se probo primero con 1.8 (el valor del resto del
    // catalogo) y con render real se confirmo el mismo problema que
    // character-wave-hello documento: con PHOTO_MAX_WIDTH=1.8 el borde del
    // marco ya ocupa el frustum visible casi por completo en el punto mas
    // cerrado del sway_dolly (t~6-8s), dejando margen ~0 para el personaje
    // sin recortarlo o sin que se encime con la foto. Se bajo a 1.2 (mismo
    // valor que character-wave-hello) tras verificar con renders reales que
    // con este valor + CHARACTER_TARGET_HEIGHT=1.1 el personaje cabe junto
    // al marco sin recorte ni encimado en t=6.0/8.0 (ver reporte de Tarea 5
    // para las mediciones y capturas).
    const PHOTO_MAX_WIDTH = 1.2;
    const PHOTO_MAX_HEIGHT = 3.0;

    const aspect = photo_aspect > 0 ? photo_aspect : 1;
    const PHOTO_WIDTH = Math.min(PHOTO_MAX_WIDTH, PHOTO_MAX_HEIGHT * aspect);
    const PHOTO_HEIGHT = PHOTO_WIDTH / aspect;

    const photoImg = document.getElementById("product-photo");
    const vars = window.__hyperframes.getVariables();
    if (vars.photo_src && vars.photo_src !== photoImg.src) {
      photoImg.src = vars.photo_src;
    }

    const photoGeometry = new THREE.PlaneGeometry(PHOTO_WIDTH, PHOTO_HEIGHT);
    const photoMaterial = new THREE.MeshBasicMaterial({ color: 0xffffff });
    const photoMesh = new THREE.Mesh(photoGeometry, photoMaterial);
    photoMesh.position.z = 0.05;
    cardGroup.add(photoMesh);

    function applyPhotoTexture() {
      const texture = new THREE.Texture(photoImg);
      texture.needsUpdate = true;
      texture.colorSpace = THREE.SRGBColorSpace;
      photoMaterial.map = texture;
      photoMaterial.needsUpdate = true;
    }

    // 3 movimientos de camara seleccionables independientemente del efecto
    // de este template -- mismas 3 funciones literales que el resto del
    // catalogo (Tarea 3), sin modulo compartido.
    function applyCameraMotion_swayDolly(t, camera, cardGroup) {
      camera.position.x = 0;
      camera.position.z = 7 - (t / DURATION) * 1.5;
      cardGroup.rotation.y = Math.sin(t * 0.5) * 0.35;
      cardGroup.rotation.x = Math.sin(t * 0.35) * 0.08;
      cardGroup.position.y = Math.sin(t * 1.2) * 0.15;
    }

    function applyCameraMotion_staticHold(t, camera, cardGroup) {
      camera.position.x = 0;
      camera.position.z = 6;
      cardGroup.rotation.y = 0;
      cardGroup.rotation.x = 0;
      cardGroup.position.y = 0;
    }

    function applyCameraMotion_slowOrbit(t, camera, cardGroup) {
      const radius = 6.5;
      const ARC_RANGE = 0.6;
      const angle = Math.sin(t * 0.25) * ARC_RANGE;
      camera.position.x = Math.sin(angle) * radius;
      camera.position.z = Math.cos(angle) * radius;
      camera.lookAt(0, 0, 0);
      cardGroup.rotation.y = 0;
      cardGroup.rotation.x = 0;
      cardGroup.position.y = 0;
    }

    const _cameraMotionFns = {
      sway_dolly: applyCameraMotion_swayDolly,
      static_hold: applyCameraMotion_staticHold,
      slow_orbit: applyCameraMotion_slowOrbit,
    };
    function applyCameraMotion(t, camera, cardGroup) {
      const fn = _cameraMotionFns[camera_motion] || applyCameraMotion_swayDolly;
      fn(t, camera, cardGroup);
    }

    // Destello inicial, mismo lenguaje visual que el resto del catalogo.
    const BURST_DURATION_SECONDS = 0.6;
    const BURST_PEAK_INTENSITY = 2.5;
    const KEY_LIGHT_BASE_INTENSITY = 2.0;

    // El personaje arranca en WALK_START_X=-1.3 -- en t=0 esto lo deja
    // PARCIALMENTE dentro de cuadro (no completamente fuera): medicion real
    // de render mostro los primeros ~9 frames con el personaje cortado por
    // el borde izquierdo del canvas antes de entrar del todo. Mismo margen
    // "fuera de camara" (1.3) que ya usa frame-assembly.html para sus
    // piezas que vuelan desde fuera de cuadro, pero ahi el frustum en juego
    // es distinto y si queda completamente fuera.
    const WALK_START_X = -1.3;
    // Derivado de PHOTO_WIDTH en vez de un valor fijo (0.95 asumia el
    // PHOTO_MAX_WIDTH=1.2 del caso cuadrado): con PHOTO_WIDTH/2 + 0.35 el
    // personaje siempre termina a un margen fijo del borde del marco sin
    // encimarse con la foto, sea cual sea el aspect ratio de la foto real
    // (verificado con render real en el caso cuadrado, PHOTO_WIDTH=1.2 ->
    // WALK_END_X=0.95, identico al valor fijo anterior).
    const WALK_END_X = PHOTO_WIDTH / 2 + 0.35;
    // "walk" dura 0.97s (LICENSES.md). El bounding box preciso (post-skinning,
    // no el de la pose de referencia sin animar) de cada pose del ciclo se
    // midio con un harness de puppeteer real (Box3.setFromObject(obj, true)
    // en cada instante del clip) -- la pose en clip-local-time~0 (múltiplos
    // exactos de 0.97s) NO es una pose neutral "de pie": es casi tan ancha
    // (~1.6 unidades) como alta, con piernas y brazos en zancada abierta.
    // La pose MAS ANGOSTA del ciclo completo (~0.49 unidades de ancho, minimo
    // real medido, no estimado) cae en clip-local-time~0.30s -- coincide con
    // el instante en que las piernas se cruzan a medio paso. 3*0.97+0.30=3.21
    // congela ahi (tras 3 zancadas completas cruzando pantalla), lo que deja
    // hueco suficiente junto al marco sin recorte (ver reporte de Tarea 5).
    const WALK_DURATION = 3.21;

    const characterGroup = new THREE.Group();
    // Xbot (mascot.glb) ya tiene su origen en los pies (Y=0 en la base) --
    // NO sumar CHARACTER_TARGET_HEIGHT/2 aqui (ese termino asumia un pivote
    // centrado que este rig no tiene). Los pies quedan al nivel del borde
    // inferior de la foto con -PHOTO_HEIGHT/2, sin mas.
    const CHARACTER_Y = -PHOTO_HEIGHT / 2;
    // z=0.15 (no 0.2): lo suficiente para quedar delante del marco (que
    // llega hasta z=0.01) sin acercarse tanto a la camara que reduzca el
    // frustum disponible mas de lo necesario en la posicion final.
    characterGroup.position.set(WALK_START_X, CHARACTER_Y, 0.15);
    cardGroup.add(characterGroup);

    function renderAt(time) {
      const t = Math.min(time, DURATION);
      lastRequestedTime = t;
      applyCameraMotion(t, camera, cardGroup);

      const walkP = Math.min(t / WALK_DURATION, 1);
      characterGroup.position.x = THREE.MathUtils.lerp(WALK_START_X, WALK_END_X, walkP);

      // El personaje puede tardar en cargar (fetch+parse de mascot.glb) --
      // si todavia no existe, seguimos renderizando foto+marco sin el en
      // vez de dejar el canvas sin pintar (ver comentario mas arriba).
      // El ciclo de caminata solo avanza mientras el personaje se desplaza --
      // al llegar a WALK_END_X se congela en la ultima pose evaluada (mismo
      // criterio pragmatico que el resto del catalogo: aceptar un trade-off
      // visual menor documentado en vez de sincronizar stride con distancia,
      // que esta fuera de alcance de este plan).
      if (mixer) mixer.setTime(Math.min(t, WALK_DURATION));

      const burst = Math.max(0, 1 - t / BURST_DURATION_SECONDS) * BURST_PEAK_INTENSITY;
      keyLight.intensity = KEY_LIGHT_BASE_INTENSITY + burst;

      renderer.render(scene, camera);
    }

    window.addEventListener("hf-seek", (event) => {
      renderAt(event.detail.time);
    });

    // Primer render inmediato y sincronico -- foto/marco/personaje se van
    // agregando encima a medida que cargan (ver awaits mas abajo), pero el
    // canvas nunca queda sin pintar ni un solo frame.
    renderAt(lastRequestedTime);

    await photoImg.decode().catch(() => {});
    applyPhotoTexture();
    renderAt(lastRequestedTime);

    // Marco decorativo simple con el color primario de marca -- consistencia
    // visual minima con los otros templates del catalogo, sin competir con
    // el personaje.
    const FRAME_MARGIN = 0.15;
    const frameGeometry = new THREE.BoxGeometry(PHOTO_WIDTH + FRAME_MARGIN, PHOTO_HEIGHT + FRAME_MARGIN, 0.06);
    const frameMaterial = new THREE.MeshPhysicalMaterial({
      color: new THREE.Color(primary_color),
      roughness: 0.2, metalness: 0.0,
      clearcoat: 1.0, clearcoatRoughness: 0.15,
    });
    const frame = new THREE.Mesh(frameGeometry, frameMaterial);
    frame.position.z = -0.02;
    cardGroup.add(frame);

    // Personaje: cargado y normalizado en altura (no controlamos el pivote
    // del rig fuente, asi que centramos X/Z despues de escalar).
    const loader = new GLTFLoader();
    const gltf = await loader.loadAsync(CHARACTER_GLB_URL);
    const characterModel = gltf.scene;

    let box = new THREE.Box3().setFromObject(characterModel);
    let size = box.getSize(new THREE.Vector3());
    const scaleFactor = CHARACTER_TARGET_HEIGHT / size.y;
    characterModel.scale.setScalar(scaleFactor);

    box = new THREE.Box3().setFromObject(characterModel);
    const center = box.getCenter(new THREE.Vector3());
    characterModel.position.x -= center.x;
    characterModel.position.z -= center.z;

    characterGroup.add(characterModel);

    // "walk" es una animacion de locomocion completa (no aditiva como
    // "agree" en character-wave-hello) -- se reproduce directo, sin blend
    // aditivo sobre una pose base.
    mixer = new THREE.AnimationMixer(characterModel);
    const walkClip = THREE.AnimationClip.findByName(gltf.animations, WALK_CLIP_NAME);
    const walkAction = mixer.clipAction(walkClip);
    walkAction.setLoop(THREE.LoopRepeat);
    walkAction.play();

    // Personaje listo -- re-renderiza con el ultimo tiempo pedido para que
    // no quede ni un frame mostrando solo foto+marco por mas tiempo del
    // necesario.
    renderAt(lastRequestedTime);
  </script>
</body>
</html>
