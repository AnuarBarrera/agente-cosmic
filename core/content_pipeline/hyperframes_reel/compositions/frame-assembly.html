<!doctype html>
<html lang="es" data-composition-variables='[
  {"id":"photo_src","type":"string","label":"Foto del producto","default":"assets/tmp/placeholder.png"},
  {"id":"photo_aspect","type":"number","label":"Aspect ratio de la foto (ancho/alto)","default":1},
  {"id":"primary_color","type":"color","label":"Color primario","default":"#e94560"},
  {"id":"secondary_color","type":"color","label":"Color secundario","default":"#3ED694"},
  {"id":"camera_motion","type":"string","label":"Movimiento de camara","default":"sway_dolly"}
]'>
<head>
  <meta charset="UTF-8" />
  <title>Frame Assembly</title>
  <script type="importmap">
    { "imports": { "three": "./node_modules/three/build/three.module.js" } }
  </script>
  <style>
    body { margin: 0; background: #0b0f14; overflow: hidden; }
    #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
    .clip { position: absolute; inset: 0; }
    #three-canvas { width: 100%; height: 100%; display: block; }
    #product-photo { position: absolute; width: 1px; height: 1px; left: -9999px; top: -9999px; }
  </style>
</head>
<body>
  <div id="root" data-composition-id="frame-assembly" data-no-timeline data-start="0" data-width="1080" data-height="1920" data-duration="8">
    <section id="scene" class="clip" data-start="0" data-duration="8" data-track-index="0">
      <!-- data-var-src is inert here: HyperFrames only substitutes it on document
           "DOMContentLoaded", which fires AFTER this composition's module script has
           already run and read .src. The actual src is set manually below via
           window.__hyperframes.getVariables(). -->
      <img id="product-photo" data-var-src="photo_src" src="assets/tmp/placeholder.png" crossorigin="anonymous" />
      <canvas id="three-canvas"></canvas>
    </section>
  </div>
  <script type="module">
    import * as THREE from "three";

    const DURATION = 8;
    const { primary_color, secondary_color, photo_aspect, camera_motion } = window.__hyperframes.getVariables();

    const canvas = document.getElementById("three-canvas");
    const renderer = new THREE.WebGLRenderer({ canvas, alpha: false, antialias: true });
    renderer.setSize(1080, 1920, false);
    renderer.setPixelRatio(1);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0b0f14);
    const camera = new THREE.PerspectiveCamera(35, 1080 / 1920, 0.1, 100);
    camera.position.set(0, 0, 7);

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
    scene.add(ambientLight);
    const keyLight = new THREE.DirectionalLight(0xffffff, 2.0);
    keyLight.position.set(2, 3, 4);
    keyLight.castShadow = true;
    keyLight.shadow.mapSize.width = 1024;
    keyLight.shadow.mapSize.height = 1024;
    keyLight.shadow.camera.left = -1.6;
    keyLight.shadow.camera.right = 1.6;
    keyLight.shadow.camera.top = 2.2;
    keyLight.shadow.camera.bottom = -2.2;
    keyLight.shadow.camera.near = 1;
    keyLight.shadow.camera.far = 10;
    scene.add(keyLight);
    const fillLight = new THREE.DirectionalLight(0xaad4ff, 0.6);
    fillLight.position.set(-3, 1, 2);
    scene.add(fillLight);
    const rimLight = new THREE.DirectionalLight(new THREE.Color(secondary_color), 1.5);
    rimLight.position.set(-1, 2, -3);
    scene.add(rimLight);

    const cardGroup = new THREE.Group();
    scene.add(cardGroup);

    // Misma camara que confetti-fall.html -- mismos limites de frustum
    // (HALLAZGO 86/87): semi-ancho visible ~0.967-1.233, semi-alto visible
    // ~1.719-2.192 segun el punto del dolly (z=7 a z=5.5).
    const PHOTO_MAX_WIDTH = 1.8;
    const PHOTO_MAX_HEIGHT = 3.0;
    // grosor de cada barra del marco (borde visible). OJO: igual que en
    // confetti-fall.html, este margen es correcto solo para la FOTO. Las
    // barras SI extienden la geometria real a semi-extension
    // PHOTO_WIDTH/2 + BORDER_THICKNESS = 1.0, que se recorta minimamente en
    // el punto mas ajustado del dolly (semi-ancho visible 0.9755 a z=5.5).
    // Preexistente de Fase A, afecta solo al borde (nunca a la foto), y ya
    // fue aprobado visualmente asi -- trade-off aceptado, no un bug.
    const BORDER_THICKNESS = 0.1;

    const aspect = photo_aspect > 0 ? photo_aspect : 1;
    const PHOTO_WIDTH = Math.min(PHOTO_MAX_WIDTH, PHOTO_MAX_HEIGHT * aspect);
    const PHOTO_HEIGHT = PHOTO_WIDTH / aspect;

    const photoImg = document.getElementById("product-photo");
    const vars = window.__hyperframes.getVariables();
    if (vars.photo_src && vars.photo_src !== photoImg.src) {
      photoImg.src = vars.photo_src;
    }

    await photoImg.decode().catch(() => {});

    // La foto se parte en 4 cuadrantes que vuelan desde fuera de camara y se
    // ensamblan -- cada cuadrante usa su propia Texture (misma imagen fuente,
    // distinto repeat/offset) para mostrar solo su porcion de la foto. Comparte
    // el mismo ASSEMBLY_DURATION/OFFSET_DISTANCE que las barras del marco (mas
    // abajo) para que todo encaje al mismo tiempo.
    const qW = PHOTO_WIDTH / 2;
    const qH = PHOTO_HEIGHT / 2;
    const quadrantMeshes = [];

    function makeQuadrant(finalX, finalY, offsetU, offsetV, startX, startY, startRotZ) {
      const geometry = new THREE.PlaneGeometry(qW, qH);
      const texture = new THREE.Texture(photoImg);
      texture.needsUpdate = true;
      texture.colorSpace = THREE.SRGBColorSpace;
      texture.repeat.set(0.5, 0.5);
      texture.offset.set(offsetU, offsetV);
      const material = new THREE.MeshBasicMaterial({ color: 0xffffff, map: texture });
      const mesh = new THREE.Mesh(geometry, material);
      mesh.position.z = 0.05;
      mesh.userData.finalX = finalX;
      mesh.userData.finalY = finalY;
      mesh.userData.startX = startX;
      mesh.userData.startY = startY;
      mesh.userData.startRotZ = startRotZ;
      cardGroup.add(mesh);
      quadrantMeshes.push(mesh);
      return mesh;
    }

    // Marco construido con 4 barras (arriba/abajo/izquierda/derecha) en vez de
    // una sola caja solida -- permite que cada barra "vuele" desde fuera de
    // camara y se ensamble en su lugar (identidad de movimiento propia de
    // este template: "reveal por construccion").
    // transmission removido por completo (revision final de rama, C1): con
    // 4 barras transmisivas el render end-to-end tardaba 116.8s, 2.7% de
    // margen bajo el timeout de 120s -- no es margen real bajo carga.
    // roughness bajo + clearcoat siguen dando aspecto de vidrio sin ese
    // costo. NO reintroducir transmission aqui.
    const barMaterial = new THREE.MeshPhysicalMaterial({
      color: new THREE.Color(primary_color),
      roughness: 0.2, metalness: 0.0,
      clearcoat: 1.0, clearcoatRoughness: 0.15,
    });

    const ASSEMBLY_DURATION = 2.0; // segundos que tardan las barras en llegar a su lugar
    // Unidades fuera de camara desde donde vuelan las barras/cuadrantes.
    // Bajado de 3.0 a 1.3 (revision final de rama, I3): con 3.0 y ease-out
    // cubico, ni las barras ni los cuadrantes cruzaban el frustum hasta
    // t~0.5-0.74s -- los primeros ~12 frames del reel eran un rectangulo
    // solido uniforme (sin ningun contenido), lo cual contradice el
    // "momento wow desde el primer segundo". Verificado con stddev de
    // pixeles: con 1.3 el frame en t=0.04 ya no es uniforme.
    const OFFSET_DISTANCE = 1.3;

    makeQuadrant(-qW / 2, qH / 2, 0, 0.5, -qW / 2 - OFFSET_DISTANCE, qH / 2 + OFFSET_DISTANCE, -Math.PI / 8);
    makeQuadrant(qW / 2, qH / 2, 0.5, 0.5, qW / 2 + OFFSET_DISTANCE, qH / 2 + OFFSET_DISTANCE, Math.PI / 8);
    makeQuadrant(-qW / 2, -qH / 2, 0, 0, -qW / 2 - OFFSET_DISTANCE, -qH / 2 - OFFSET_DISTANCE, Math.PI / 8);
    makeQuadrant(qW / 2, -qH / 2, 0.5, 0, qW / 2 + OFFSET_DISTANCE, -qH / 2 - OFFSET_DISTANCE, -Math.PI / 8);

    function makeBar(width, height, finalX, finalY, startX, startY, startRotZ) {
      const geometry = new THREE.BoxGeometry(width, height, 0.08);
      const mesh = new THREE.Mesh(geometry, barMaterial);
      // Antes quedaban en z=0 (implicito), DETRAS de los cuadrantes de la foto
      // (z=0.05) -- una barra detras no puede proyectar sombra hacia adelante
      // (la luz viaja hacia -z). Se mueven a z=0.06, delante de los
      // cuadrantes, para que el marco proyecte sombra real sobre la foto. Las
      // barras solo ocupan el borde exterior, nunca se superponen con el area
      // de la foto en X/Y, asi que este cambio no tapa nada del centro.
      mesh.position.z = 0.06;
      mesh.castShadow = true;
      mesh.userData.finalX = finalX;
      mesh.userData.finalY = finalY;
      mesh.userData.startX = startX;
      mesh.userData.startY = startY;
      mesh.userData.startRotZ = startRotZ;
      cardGroup.add(mesh);
      return mesh;
    }

    const topBarY = PHOTO_HEIGHT / 2 + BORDER_THICKNESS / 2;
    const bottomBarY = -topBarY;
    const sideBarX = PHOTO_WIDTH / 2 + BORDER_THICKNESS / 2;
    const barWidth = PHOTO_WIDTH + 2 * BORDER_THICKNESS;

    const frameBars = [
      makeBar(barWidth, BORDER_THICKNESS, 0, topBarY, 0, topBarY + OFFSET_DISTANCE, Math.PI / 6),
      makeBar(barWidth, BORDER_THICKNESS, 0, bottomBarY, 0, bottomBarY - OFFSET_DISTANCE, -Math.PI / 6),
      makeBar(BORDER_THICKNESS, PHOTO_HEIGHT, -sideBarX, 0, -sideBarX - OFFSET_DISTANCE, 0, -Math.PI / 4),
      makeBar(BORDER_THICKNESS, PHOTO_HEIGHT, sideBarX, 0, sideBarX + OFFSET_DISTANCE, 0, Math.PI / 4),
    ];

    // Plano invisible salvo donde le cae sombra encima. Z=0.055: detras de
    // las barras (0.06, para recibir su sombra) pero delante de los
    // cuadrantes de la foto (0.05, para que la sombra se componga visualmente
    // sobre ella). No se toca el material de los cuadrantes (MeshBasicMaterial
    // con la textura de la foto) para no alterar sus colores.
    const shadowCatcherGeometry = new THREE.PlaneGeometry(barWidth, PHOTO_HEIGHT + 2 * BORDER_THICKNESS);
    const shadowCatcherMaterial = new THREE.ShadowMaterial({ opacity: 0.4 });
    const shadowCatcher = new THREE.Mesh(shadowCatcherGeometry, shadowCatcherMaterial);
    shadowCatcher.position.z = 0.055;
    shadowCatcher.receiveShadow = true;
    cardGroup.add(shadowCatcher);

    // Destello ("pattern interrupt") centrado en el momento en que el marco
    // termina de ensamblarse (t=ASSEMBLY_DURATION), no al inicio -- se siente
    // como un "click" al encajar en su lugar.
    const BURST_WINDOW_SECONDS = 0.4;
    const BURST_PEAK_INTENSITY = 2.0;
    const KEY_LIGHT_BASE_INTENSITY = 2.0;

    // 3 movimientos de camara seleccionables independientemente del efecto de
    // este template (feedback Anuar: el balanceo/dolly no debe ser la norma
    // fija de todo video). swayDolly es el comportamiento historico (Fase A/B)
    // -- debe quedar visualmente identico a como estaba antes de este cambio.
    // Ninguna de las 3 acerca la camara a menos de 5.45 unidades del origen
    // (limite mas ajustado ya validado, HALLAZGO 86/87) para no recortar la foto.
    function applyCameraMotion_swayDolly(t, camera, cardGroup) {
      camera.position.x = 0;
      camera.position.z = 7 - (t / DURATION) * 1.5;
      cardGroup.rotation.y = Math.sin(t * 0.5) * 0.35;
      cardGroup.rotation.x = Math.sin(t * 0.35) * 0.08;
      cardGroup.position.y = Math.sin(t * 1.2) * 0.15;
    }

    function applyCameraMotion_staticHold(t, camera, cardGroup) {
      camera.position.x = 0;
      camera.position.z = 6; // por encima del limite de 5.45, sin balanceo
      cardGroup.rotation.y = 0;
      cardGroup.rotation.x = 0;
      cardGroup.position.y = 0;
    }

    function applyCameraMotion_slowOrbit(t, camera, cardGroup) {
      // Radio CONSTANTE (nunca menor a 5.45): x = sin(angulo)*radio,
      // z = cos(angulo)*radio siempre da distancia = radio al origen,
      // sea cual sea el angulo -- por eso es seguro aunque el angulo cambie.
      const radius = 6.5;
      const ARC_RANGE = 0.6; // radianes de vaiven (~34 grados), arco lento y sutil
      const angle = Math.sin(t * 0.25) * ARC_RANGE;
      camera.position.x = Math.sin(angle) * radius;
      camera.position.z = Math.cos(angle) * radius;
      camera.lookAt(0, 0, 0);
      cardGroup.rotation.y = 0;
      cardGroup.rotation.x = 0;
      cardGroup.position.y = 0;
    }

    const _cameraMotionFns = {
      sway_dolly: applyCameraMotion_swayDolly,
      static_hold: applyCameraMotion_staticHold,
      slow_orbit: applyCameraMotion_slowOrbit,
    };
    function applyCameraMotion(t, camera, cardGroup) {
      const fn = _cameraMotionFns[camera_motion] || applyCameraMotion_swayDolly;
      fn(t, camera, cardGroup);
    }

    function renderAt(time) {
      const t = Math.min(time, DURATION);
      applyCameraMotion(t, camera, cardGroup);

      const assembleP = Math.min(t / ASSEMBLY_DURATION, 1);
      const eased = 1 - Math.pow(1 - assembleP, 3); // ease-out cubico
      frameBars.forEach((bar) => {
        bar.position.x = THREE.MathUtils.lerp(bar.userData.startX, bar.userData.finalX, eased);
        bar.position.y = THREE.MathUtils.lerp(bar.userData.startY, bar.userData.finalY, eased);
        bar.rotation.z = THREE.MathUtils.lerp(bar.userData.startRotZ, 0, eased);
      });

      quadrantMeshes.forEach((mesh) => {
        mesh.position.x = THREE.MathUtils.lerp(mesh.userData.startX, mesh.userData.finalX, eased);
        mesh.position.y = THREE.MathUtils.lerp(mesh.userData.startY, mesh.userData.finalY, eased);
        mesh.rotation.z = THREE.MathUtils.lerp(mesh.userData.startRotZ, 0, eased);
      });

      const burst = Math.max(0, 1 - Math.abs(t - ASSEMBLY_DURATION) / BURST_WINDOW_SECONDS) * BURST_PEAK_INTENSITY;
      keyLight.intensity = KEY_LIGHT_BASE_INTENSITY + burst;

      renderer.render(scene, camera);
    }

    window.addEventListener("hf-seek", (event) => {
      renderAt(event.detail.time);
    });

    renderAt(window.__hfThreeTime || 0);
  </script>
</body>
</html>
