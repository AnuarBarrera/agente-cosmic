<!doctype html>
<html lang="es" data-composition-variables='[
  {"id":"photo_src","type":"string","label":"Foto del producto","default":"assets/tmp/placeholder.png"},
  {"id":"photo_aspect","type":"number","label":"Aspect ratio de la foto (ancho/alto)","default":1},
  {"id":"secondary_color","type":"color","label":"Color secundario","default":"#3ED694"},
  {"id":"camera_motion","type":"string","label":"Movimiento de camara","default":"sway_dolly"}
]'>
<head>
  <meta charset="UTF-8" />
  <title>Glass Shatter Reveal</title>
  <script type="importmap">
    { "imports": { "three": "./node_modules/three/build/three.module.js" } }
  </script>
  <style>
    body { margin: 0; background: #0b0f14; overflow: hidden; }
    #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
    .clip { position: absolute; inset: 0; }
    #three-canvas { width: 100%; height: 100%; display: block; }
    #product-photo { position: absolute; width: 1px; height: 1px; left: -9999px; top: -9999px; }
  </style>
</head>
<body>
  <div id="root" data-composition-id="glass-shatter-reveal" data-no-timeline data-start="0" data-width="1080" data-height="1920" data-duration="8">
    <section id="scene" class="clip" data-start="0" data-duration="8" data-track-index="0">
      <img id="product-photo" data-var-src="photo_src" src="assets/tmp/placeholder.png" crossorigin="anonymous" />
      <canvas id="three-canvas"></canvas>
    </section>
  </div>
  <script type="module">
    import * as THREE from "three";

    const DURATION = 8;
    const { secondary_color, photo_aspect, camera_motion } = window.__hyperframes.getVariables();

    const canvas = document.getElementById("three-canvas");
    const renderer = new THREE.WebGLRenderer({ canvas, alpha: false, antialias: true });
    renderer.setSize(1080, 1920, false);
    renderer.setPixelRatio(1);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0b0f14);
    const camera = new THREE.PerspectiveCamera(35, 1080 / 1920, 0.1, 100);
    camera.position.set(0, 0, 7);

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
    scene.add(ambientLight);
    const keyLight = new THREE.DirectionalLight(0xffffff, 2.0);
    keyLight.position.set(2, 3, 4);
    keyLight.castShadow = true;
    keyLight.shadow.mapSize.width = 1024;
    keyLight.shadow.mapSize.height = 1024;
    keyLight.shadow.camera.left = -1.6;
    keyLight.shadow.camera.right = 1.6;
    keyLight.shadow.camera.top = 2.2;
    keyLight.shadow.camera.bottom = -2.2;
    keyLight.shadow.camera.near = 1;
    keyLight.shadow.camera.far = 10;
    scene.add(keyLight);
    const fillLight = new THREE.DirectionalLight(0xaad4ff, 0.6);
    fillLight.position.set(-3, 1, 2);
    scene.add(fillLight);
    const rimLight = new THREE.DirectionalLight(new THREE.Color(secondary_color), 1.5);
    rimLight.position.set(-1, 2, -3);
    scene.add(rimLight);

    const cardGroup = new THREE.Group();
    scene.add(cardGroup);

    // Misma camara que confetti-fall.html -- mismos limites de frustum.
    const PHOTO_MAX_WIDTH = 1.8;
    const PHOTO_MAX_HEIGHT = 3.0;

    const aspect = photo_aspect > 0 ? photo_aspect : 1;
    const PHOTO_WIDTH = Math.min(PHOTO_MAX_WIDTH, PHOTO_MAX_HEIGHT * aspect);
    const PHOTO_HEIGHT = PHOTO_WIDTH / aspect;

    const photoImg = document.getElementById("product-photo");
    const vars = window.__hyperframes.getVariables();
    if (vars.photo_src && vars.photo_src !== photoImg.src) {
      photoImg.src = vars.photo_src;
    }

    const photoGeometry = new THREE.PlaneGeometry(PHOTO_WIDTH, PHOTO_HEIGHT);
    const photoMaterial = new THREE.MeshBasicMaterial({ color: 0xffffff });
    const photoMesh = new THREE.Mesh(photoGeometry, photoMaterial);
    photoMesh.position.z = 0.05;
    cardGroup.add(photoMesh);

    // Plano invisible salvo donde le cae sombra encima. No se toca el
    // material de la foto (MeshBasicMaterial) para no alterar sus colores.
    // Los fragmentos de vidrio (z=0.1) quedan delante de este plano, en la
    // trayectoria de la luz hacia -z, por eso reciben la sombra correctamente.
    const SHADOW_CATCHER_BASE_OPACITY = 0.4;
    const shadowCatcherGeometry = new THREE.PlaneGeometry(PHOTO_WIDTH, PHOTO_HEIGHT);
    const shadowCatcherMaterial = new THREE.ShadowMaterial({ opacity: SHADOW_CATCHER_BASE_OPACITY });
    const shadowCatcher = new THREE.Mesh(shadowCatcherGeometry, shadowCatcherMaterial);
    shadowCatcher.position.z = 0.055;
    shadowCatcher.receiveShadow = true;
    cardGroup.add(shadowCatcher);

    function applyPhotoTexture() {
      const texture = new THREE.Texture(photoImg);
      texture.needsUpdate = true;
      texture.colorSpace = THREE.SRGBColorSpace;
      photoMaterial.map = texture;
      photoMaterial.needsUpdate = true;
    }

    await photoImg.decode().catch(() => {});
    applyPhotoTexture();

    // Panel de vidrio en frente de la foto, dividido en una grilla 3x3 de
    // fragmentos que en conjunto forman un panel solido en t=0 (ocultando la
    // foto), y que se separan/desvanecen en los primeros SHATTER_DURATION
    // segundos revelandola -- identidad de movimiento propia: "reveal
    // dramatico".
    const SHATTER_DURATION = 1.5;
    const SHATTER_FLY_DISTANCE = 1.5;
    function pseudoRandom(seed) {
      const x = Math.sin(seed * 12.9898) * 43758.5453;
      return x - Math.floor(x); // parte fraccionaria, deterministico -- NO es Math.random()
    }

    const GLASS_COLOR_SKY = '#87CEEB';
    const GLASS_COLOR_WHITE = '#FFFFFF';

    const GRID = 3;
    const cellW = PHOTO_WIDTH / GRID;
    const cellH = PHOTO_HEIGHT / GRID;
    const JITTER = Math.min(cellW, cellH) * 0.3;

    function latticePoint(row, col) {
      const baseX = -PHOTO_WIDTH / 2 + col * cellW;
      const baseY = PHOTO_HEIGHT / 2 - row * cellH;
      const isBoundary = row === 0 || row === GRID || col === 0 || col === GRID;
      if (isBoundary) return { x: baseX, y: baseY };
      const seedX = (row * 7 + col * 13) * 3.17;
      const seedY = (row * 11 + col * 17) * 2.31;
      const jitterX = (pseudoRandom(seedX) - 0.5) * 2 * JITTER;
      const jitterY = (pseudoRandom(seedY) - 0.5) * 2 * JITTER;
      return { x: baseX + jitterX, y: baseY + jitterY };
    }

    const lattice = [];
    for (let row = 0; row <= GRID; row++) {
      const rowPoints = [];
      for (let col = 0; col <= GRID; col++) {
        rowPoints.push(latticePoint(row, col));
      }
      lattice.push(rowPoints);
    }

    const fragments = [];
    for (let row = 0; row < GRID; row++) {
      for (let col = 0; col < GRID; col++) {
        const p1 = lattice[row][col];
        const p2 = lattice[row][col + 1];
        const p3 = lattice[row + 1][col + 1];
        const p4 = lattice[row + 1][col];
        const cx = (p1.x + p2.x + p3.x + p4.x) / 4;
        const cy = (p1.y + p2.y + p3.y + p4.y) / 4;

        const shape = new THREE.Shape();
        shape.moveTo(p1.x - cx, p1.y - cy);
        shape.lineTo(p2.x - cx, p2.y - cy);
        shape.lineTo(p3.x - cx, p3.y - cy);
        shape.lineTo(p4.x - cx, p4.y - cy);
        shape.closePath();
        const fragGeometry = new THREE.ShapeGeometry(shape);

        const mixT = pseudoRandom((row * GRID + col) * 7.73);
        const fragColor = new THREE.Color(GLASS_COLOR_SKY).lerp(new THREE.Color(GLASS_COLOR_WHITE), mixT);
        // roughness 0.6 (el brief original pedia 0.1): con roughness bajo la
        // foto se veia a traves del panel en t=0, rompiendo el efecto de
        // "reveal" -- 0.6 da un aspecto de vidrio esmerilado que sigue
        // ocultando la foto por completo. NO bajar este valor.
        // transmission removido por completo (revision final de rama, C1):
        // con 9 shards transmisivos el render end-to-end excedia el timeout
        // de 120s (timeout/None, igual que confetti-fall). clearcoat +
        // roughness siguen dando aspecto de vidrio sin ese costo.
        const fragMaterial = new THREE.MeshPhysicalMaterial({
          color: fragColor, roughness: 0.6, metalness: 0.1,
          clearcoat: 1.0, clearcoatRoughness: 0.05,
          transparent: true, opacity: 1,
        });
        // ShapeGeometry es plana (2D, una sola capa de triangulos, sin
        // "reverso" real). Three.js renderiza el shadow map usando el lado
        // OPUESTO a material.side por defecto (evita peter-panning en
        // solidos con volumen real) -- para una geometria sin reverso eso
        // deja el shadow map sin nada que dibujar y el fragmento nunca
        // proyecta sombra (verificado: renderer.shadowMap.enabled
        // true/false daba frames identicos byte a byte hasta este fix).
        // DoubleSide en el shadow pass evita depender de la orientacion del
        // winding de cada shard.
        fragMaterial.shadowSide = THREE.DoubleSide;
        const frag = new THREE.Mesh(fragGeometry, fragMaterial);
        frag.castShadow = true;
        frag.position.set(cx, cy, 0.1);
        const dirLen = Math.hypot(cx, cy) || 1;
        frag.userData.finalX = cx;
        frag.userData.finalY = cy;
        frag.userData.flyX = cx + (cx / dirLen) * SHATTER_FLY_DISTANCE;
        frag.userData.flyY = cy + (cy / dirLen) * SHATTER_FLY_DISTANCE;
        frag.userData.spinSpeed = 1.0 + (row * GRID + col) * 0.15;
        cardGroup.add(frag);
        fragments.push(frag);
      }
    }

    // Destello en el momento del impacto (t=0), igual que confetti-fall.
    const BURST_DURATION_SECONDS = 0.6;
    const BURST_PEAK_INTENSITY = 2.5;
    const KEY_LIGHT_BASE_INTENSITY = 2.0;

    // 3 movimientos de camara seleccionables independientemente del efecto de
    // este template (feedback Anuar: el balanceo/dolly no debe ser la norma
    // fija de todo video). swayDolly es el comportamiento historico (Fase A/B)
    // -- debe quedar visualmente identico a como estaba antes de este cambio.
    // Ninguna de las 3 acerca la camara a menos de 5.45 unidades del origen
    // (limite mas ajustado ya validado, HALLAZGO 86/87) para no recortar la foto.
    function applyCameraMotion_swayDolly(t, camera, cardGroup) {
      camera.position.x = 0;
      camera.position.z = 7 - (t / DURATION) * 1.5;
      cardGroup.rotation.y = Math.sin(t * 0.5) * 0.35;
      cardGroup.rotation.x = Math.sin(t * 0.35) * 0.08;
      cardGroup.position.y = Math.sin(t * 1.2) * 0.15;
    }

    function applyCameraMotion_staticHold(t, camera, cardGroup) {
      camera.position.x = 0;
      camera.position.z = 6; // por encima del limite de 5.45, sin balanceo
      cardGroup.rotation.y = 0;
      cardGroup.rotation.x = 0;
      cardGroup.position.y = 0;
    }

    function applyCameraMotion_slowOrbit(t, camera, cardGroup) {
      // Radio CONSTANTE (nunca menor a 5.45): x = sin(angulo)*radio,
      // z = cos(angulo)*radio siempre da distancia = radio al origen,
      // sea cual sea el angulo -- por eso es seguro aunque el angulo cambie.
      const radius = 6.5;
      const ARC_RANGE = 0.6; // radianes de vaiven (~34 grados), arco lento y sutil
      const angle = Math.sin(t * 0.25) * ARC_RANGE;
      camera.position.x = Math.sin(angle) * radius;
      camera.position.z = Math.cos(angle) * radius;
      camera.lookAt(0, 0, 0);
      cardGroup.rotation.y = 0;
      cardGroup.rotation.x = 0;
      cardGroup.position.y = 0;
    }

    const _cameraMotionFns = {
      sway_dolly: applyCameraMotion_swayDolly,
      static_hold: applyCameraMotion_staticHold,
      slow_orbit: applyCameraMotion_slowOrbit,
    };
    function applyCameraMotion(t, camera, cardGroup) {
      const fn = _cameraMotionFns[camera_motion] || applyCameraMotion_swayDolly;
      fn(t, camera, cardGroup);
    }

    function renderAt(time) {
      const t = Math.min(time, DURATION);
      applyCameraMotion(t, camera, cardGroup);

      const shatterP = Math.min(t / SHATTER_DURATION, 1);
      const eased = shatterP * shatterP; // ease-in, se siente como una explosion
      fragments.forEach((frag) => {
        frag.position.x = THREE.MathUtils.lerp(frag.userData.finalX, frag.userData.flyX, eased);
        frag.position.y = THREE.MathUtils.lerp(frag.userData.finalY, frag.userData.flyY, eased);
        frag.rotation.z = eased * frag.userData.spinSpeed * Math.PI;
        frag.material.opacity = 1 - eased;
      });
      // Todos los fragmentos comparten el mismo `eased` (no hay variacion
      // por-fragmento en su opacidad), asi que la sombra combinada se puede
      // atar 1:1 a esa misma curva: en t=0 el panel esta opaco y la sombra
      // a su intensidad base; al terminar SHATTER_DURATION los fragmentos ya
      // son invisibles (opacity=0) y la sombra tambien llega a 0 -- evita el
      // artefacto de una sombra opaca "fantasma" sobre vidrio ya transparente.
      shadowCatcherMaterial.opacity = SHADOW_CATCHER_BASE_OPACITY * (1 - eased);

      const burst = Math.max(0, 1 - t / BURST_DURATION_SECONDS) * BURST_PEAK_INTENSITY;
      keyLight.intensity = KEY_LIGHT_BASE_INTENSITY + burst;

      renderer.render(scene, camera);
    }

    window.addEventListener("hf-seek", (event) => {
      renderAt(event.detail.time);
    });

    renderAt(window.__hfThreeTime || 0);
  </script>
</body>
</html>
