<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1080px; height: 1080px; overflow: hidden;
    position: relative;
    font-family: 'Arial', sans-serif;
    background-image: url({{bg_data_url}});
    background-size: cover;
    background-position: center;
  }
  .overlay {
    position: absolute; inset: 0;
    background: rgba(0,0,0,0.28);
  }
  .panel {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 84%;
    background: rgba(8,8,18,0.80);
    backdrop-filter: blur(6px);
    border-radius: 20px;
    padding: 56px 60px;
    text-align: center;
    border: 1px solid rgba(255,255,255,0.08);
  }
  .tag {
    display: inline-block;
    background: {{primary_color}};
    color: white;
    padding: 8px 22px; border-radius: 30px;
    font-size: 20px; font-weight: 800;
    letter-spacing: 3px; text-transform: uppercase;
    margin-bottom: 28px;
  }
  h1 {
    font-size: 68px; font-weight: 900;
    color: white; line-height: 1.05;
    margin-bottom: 20px;
    text-shadow: 1px 2px 10px rgba(0,0,0,0.6);
  }
  .subtitle {
    font-size: 27px; color: rgba(255,255,255,0.85);
    line-height: 1.5; margin-bottom: 36px;
  }
  .cta {
    display: inline-block;
    background: {{primary_color}};
    color: white;
    padding: 14px 32px; border-radius: 30px;
    font-size: 22px; font-weight: 800;
    box-shadow: 0 4px 24px rgba(0,0,0,0.45);
  }
</style>
</head>
<body>
  <div class="overlay"></div>
  <div class="panel">
    <div class="tag">{{tag}}</div>
    <h1>{{headline}}</h1>
    <p class="subtitle">{{subtitle}}</p>
    <p class="cta">{{cta}} →</p>
  </div>
</body>
</html>
