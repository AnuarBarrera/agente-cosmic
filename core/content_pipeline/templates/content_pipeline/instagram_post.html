<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1080px; height: 1080px; overflow: hidden;
    position: relative;
    font-family: 'Arial', sans-serif;
    background-image: url({{bg_data_url}});
    background-size: cover;
    background-position: center;
  }
  .overlay {
    position: absolute; inset: 0;
    background: linear-gradient(
      to bottom,
      rgba(0,0,0,0.05) 0%,
      rgba(0,0,0,0.20) 45%,
      rgba(0,0,0,0.72) 100%
    );
  }
  .content {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    justify-content: flex-end;
    padding: 72px 80px;
  }
  .tag {
    display: inline-block;
    background: {{primary_color}};
    color: white;
    padding: 8px 22px; border-radius: 30px;
    font-size: 22px; font-weight: 800;
    letter-spacing: 3px; text-transform: uppercase;
    margin-bottom: 24px;
    width: fit-content;
  }
  h1 {
    font-size: 72px; font-weight: 900;
    color: white; line-height: 1.05;
    margin-bottom: 18px;
    text-shadow: 2px 3px 14px rgba(0,0,0,0.75);
  }
  .subtitle {
    font-size: 30px; color: rgba(255,255,255,0.90);
    line-height: 1.45; margin-bottom: 32px;
    text-shadow: 1px 2px 8px rgba(0,0,0,0.65);
  }
  .cta {
    display: inline-block;
    align-self: flex-start;
    background: {{primary_color}};
    color: white;
    padding: 12px 28px; border-radius: 30px;
    font-size: 24px; font-weight: 800;
    box-shadow: 0 4px 20px rgba(0,0,0,0.5);
  }
</style>
</head>
<body>
  <div class="overlay"></div>
  <div class="content">
    <div class="tag">{{tag}}</div>
    <h1>{{headline}}</h1>
    <p class="subtitle">{{subtitle}}</p>
    <p class="cta">{{cta}} →</p>
  </div>
</body>
</html>
