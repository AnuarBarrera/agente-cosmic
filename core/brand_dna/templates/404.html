<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Página no encontrada · Agente Cosmic</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #0d0d1a;
      color: #f0f0f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    nav {
      background: #1a1a2e;
      padding: 14px 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #2a2a4a;
    }
    .brand { font-size: 1.2rem; font-weight: 700; color: #e94560; text-decoration: none; }
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px 20px;
      text-align: center;
    }
    .cat {
      font-size: 5rem;
      line-height: 1;
      margin-bottom: 8px;
      filter: grayscale(0.3);
    }
    .cat-ascii {
      font-family: monospace;
      font-size: 0.85rem;
      color: #555;
      margin-bottom: 32px;
      white-space: pre;
      line-height: 1.4;
    }
    .code {
      font-size: 5rem;
      font-weight: 900;
      color: #e94560;
      letter-spacing: -4px;
      line-height: 1;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 1.5rem;
      color: #f0f0f0;
      margin-bottom: 12px;
    }
    p {
      font-size: 1rem;
      color: #aaa;
      max-width: 420px;
      margin: 0 auto 40px;
      line-height: 1.6;
    }
    .actions { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; }
    .btn-primary {
      padding: 12px 28px;
      background: #e94560;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
    }
    .btn-primary:hover { background: #c73652; }
    .btn-secondary {
      padding: 12px 28px;
      background: transparent;
      color: #aaa;
      border: 1px solid #333;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      text-decoration: none;
    }
    .btn-secondary:hover { border-color: #555; color: #f0f0f0; }
  </style>
</head>
<body>
  <nav>
    <a href="/" class="brand">Agente Cosmic</a>
  </nav>

  <div class="main">
    <div class="cat">🐱</div>
    <pre class="cat-ascii"> x  x
(  -  )
 =====
  miau?</pre>

    <div class="code">404</div>
    <h1>Esta página ya no existe</h1>
    <p>
      Es posible que hayas eliminado este calendario o que el enlace haya expirado.
      No te preocupes — puedes crear uno nuevo desde el dashboard.
    </p>
    <div class="actions">
      <a href="/dashboard/" class="btn-primary">Ir al Dashboard</a>
      <a href="/" class="btn-secondary">Crear nuevo análisis</a>
    </div>
  </div>
</body>
</html>
