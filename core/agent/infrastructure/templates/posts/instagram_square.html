<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1080px; height: 1080px; overflow: hidden;
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
    display: flex; flex-direction: column;
    justify-content: center; align-items: center;
    font-family: 'Arial', sans-serif; color: white;
  }
  .container { padding: 80px; text-align: center; max-width: 900px; }
  .tag {
    display: inline-block; background: #e94560; color: white;
    padding: 8px 24px; border-radius: 30px; font-size: 28px;
    font-weight: bold; letter-spacing: 2px; text-transform: uppercase;
    margin-bottom: 40px;
  }
  h1 { font-size: 72px; font-weight: 900; line-height: 1.1; margin-bottom: 30px; }
  .subtitle { font-size: 36px; color: #a8b2d8; line-height: 1.4; margin-bottom: 50px; }
  .cta { font-size: 32px; color: #e94560; font-weight: bold; }
  .brand { position: absolute; bottom: 40px; right: 60px; font-size: 28px; opacity: 0.6; }
</style>
</head>
<body>
  <div class="container">
    <div class="tag">{{tag}}</div>
    <h1>{{title}}</h1>
    <p class="subtitle">{{subtitle}}</p>
    <p class="cta">{{cta}}</p>
  </div>
  <div class="brand">{{brand}}</div>
</body>
</html>
