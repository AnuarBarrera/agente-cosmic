<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px; height: 627px; overflow: hidden;
    background: #f3f2ef;
    display: flex; align-items: center;
    font-family: 'Arial', sans-serif;
  }
  .left-bar { width: 8px; height: 100%; background: #0a66c2; }
  .content { flex: 1; padding: 60px 80px; }
  .label {
    color: #0a66c2; font-size: 20px; font-weight: bold;
    text-transform: uppercase; letter-spacing: 3px; margin-bottom: 20px;
  }
  h1 { font-size: 56px; font-weight: 900; color: #191919; line-height: 1.1; margin-bottom: 24px; }
  .subtitle { font-size: 28px; color: #555; line-height: 1.4; margin-bottom: 32px; }
  .brand { font-size: 24px; color: #0a66c2; font-weight: bold; }
</style>
</head>
<body>
  <div class="left-bar"></div>
  <div class="content">
    <div class="label">{{label}}</div>
    <h1>{{title}}</h1>
    <p class="subtitle">{{subtitle}}</p>
    <p class="brand">{{brand}}</p>
  </div>
</body>
</html>
